<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Batalla Matemática · Ranking en Vivo</title><style>:root{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#fff;background:#070b16}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% 0,#18264a 0,#0b1020 42%,#05070d 100%);overflow-x:hidden}.wrap{max-width:1200px;margin:auto;padding:28px 24px 46px}.top{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(28px,4vw,54px)}.brand p{margin:8px 0 0;color:#9fb1d1}.controls{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #33446d;background:#121b31;color:#fff;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer}button.active{background:#ffd54a;color:#101010;border-color:#ffd54a;box-shadow:0 0 24px #ffd54a44}.status{margin:18px 0 14px;color:#8fa5ca}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.pod{background:linear-gradient(180deg,#18233d,#10172a);border:1px solid #26385f;border-radius:24px;padding:20px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 38px #0006}.pod .rank{font-size:34px}.pod .name{font-size:22px;font-weight:900;margin-top:6px}.pod .score{font-size:17px;color:#ffd54a;margin-top:7px}.board{display:grid;gap:10px}.row{display:grid;grid-template-columns:72px 1fr 150px;align-items:center;gap:14px;background:#0f172a;border:1px solid #223355;border-radius:18px;padding:14px 18px;transition:transform .7s cubic-bezier(.2,.8,.2,1),background .35s,box-shadow .35s}.row.moved{background:#17233f;box-shadow:0 0 28px #47a8ff33}.pos{font-size:24px;font-weight:950;color:#ffd54a}.who{display:flex;align-items:center;gap:12px}.avatar{font-size:30px}.nm{font-size:20px;font-weight:850}.sec{font-size:13px;color:#92a7c8}.pts{text-align:right;font-size:22px;font-weight:950}.empty{padding:50px;text-align:center;color:#9badca;border:1px dashed #304263;border-radius:22px}.live{display:inline-flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#43e17b;box-shadow:0 0 12px #43e17b;animation:p 1.2s infinite}@keyframes p{50%{opacity:.35}}@media(max-width:700px){.wrap{padding:18px 12px 34px}.controls button{flex:1 1 42%;padding:10px 8px}.podium{grid-template-columns:1fr}.row{grid-template-columns:58px 1fr 90px;padding:12px 10px}.nm{font-size:16px}.pts{font-size:18px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>⚔️ BATALLA MATEMÁTICA</h1><p>Ranking en vivo · Profe Johnny</p></div><div class="controls" id="controls"></div></div><div class="status"><span class="live"><span class="dot"></span><span id="status">Conectando con la batalla...</span></span></div><div class="podium" id="podium"></div><div class="board" id="board"></div></div><script>const API='https://santa-rita-escolar-tcpb.onrender.com/battle/v1/leaderboard',secs=['GLOBAL','2A','2B','5A','5B','PUBLIC'];let sec='GLOBAL';const c=document.getElementById('controls'),b=document.getElementById('board'),p=document.getElementById('podium'),s=document.getElementById('status');const lab=x=>x==='GLOBAL'?'GLOBAL':x==='2A'?'2.º A':x==='2B'?'2.º B':x==='5A'?'5.º A':x==='5B'?'5.º B':'Público general',key=x=>x.account_id||x.username||x.display_name,esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));secs.forEach(x=>{let z=document.createElement('button');z.textContent=x==='GLOBAL'?'🌎 GLOBAL':lab(x);z.dataset.s=x;z.onclick=()=>{sec=x;document.querySelectorAll('[data-s]').forEach(q=>q.classList.toggle('active',q.dataset.s===x));load(true)};c.appendChild(z)});document.querySelector('[data-s="GLOBAL"]').classList.add('active');let f=document.createElement('button');f.textContent='⛶ Pantalla completa';f.onclick=()=>document.documentElement.requestFullscreen?.();c.appendChild(f);function row(x){let e=document.createElement('div');e.className='row';e.dataset.key=key(x);e.innerHTML=`<div class="pos">#${x.rank}</div><div class="who"><div class="avatar">${esc(x.avatar||'⚡')}</div><div><div class="nm">${esc(x.display_name)}</div><div class="sec">${lab(x.section||sec)} · @${esc(x.username||'jugador')}</div></div></div><div class="pts">${x.best_score} pts</div>`;return e}async function load(first=false){try{const qs=sec==='GLOBAL'?'?limit=100':`?section=${sec}&limit=100`;let r=await fetch(API+qs,{cache:'no-store'});if(!r.ok)throw Error(r.status);let d=await r.json(),a=d.players||[];s.textContent=`${lab(sec)} · ${a.length} jugador${a.length===1?'':'es'} · actualización cada 2 s`;p.innerHTML=a.slice(0,3).map((x,i)=>`<div class="pod"><div class="rank">${['🥇','🥈','🥉'][i]}</div><div class="name">${esc(x.display_name)}</div><div class="score">${x.best_score} puntos · ${lab(x.section)}</div></div>`).join('');let old={};[...b.children].forEach(e=>old[e.dataset.key]=e.getBoundingClientRect().top);b.innerHTML='';if(!a.length){b.innerHTML=`<div class="empty">Todavía no hay puntajes en ${sec==='GLOBAL'?'el ranking global':lab(sec)}.</div>`;return}a.forEach(x=>b.appendChild(row(x)));requestAnimationFrame(()=>[...b.children].forEach(e=>{let o=old[e.dataset.key];if(o==null)return;let dy=o-e.getBoundingClientRect().top;if(Math.abs(dy)>2){e.style.transform=`translateY(${dy}px)`;e.classList.add('moved');requestAnimationFrame(()=>{e.style.transform='translateY(0)';setTimeout(()=>e.classList.remove('moved'),900)})}}))}catch(e){s.textContent='Sin conexión con el ranking. Reintentando...';if(first)b.innerHTML='<div class="empty">No se pudo cargar el ranking todavía.</div>'}}load(true);setInterval(()=>load(false),2000);</script></body></html>
