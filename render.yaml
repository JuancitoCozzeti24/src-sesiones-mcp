services:
  - type: web
    name: src-sesiones-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MCP_DISABLE_DNS_REBINDING
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
